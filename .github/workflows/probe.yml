name: Probe AWC products
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="turbulence-map/1.0"
          for u in "gairmet?format=json" "gairmet?format=geojson" "isigmet?format=json" "isigmet?format=geojson"; do
            echo "=== $u"
            curl -s -A "$UA" -w "\nHTTP %{http_code} size %{size_download}\n" "https://aviationweather.gov/api/data/$u" > out.txt
            tail -1 out.txt
            head -c 2500 out.txt; echo
            python3 -c "
          import json,collections
          t=open('out.txt').read().rsplit('\nHTTP',1)[0]
          d=json.loads(t)
          rows=d['features'] if isinstance(d,dict) and 'features' in d else d
          print('count',len(rows))
          get=lambda r:r.get('properties',r)
          for k in ['hazard','product','forecastHour','fcstHour','fore','validTime','tag','qualifier','firName','hazardType']:
              c=collections.Counter(str(get(r).get(k)) for r in rows)
              if any(v!='None' for v in c): print(k,dict(c.most_common(12)))
          " || true
          done
