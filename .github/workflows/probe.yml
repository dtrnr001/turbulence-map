name: Probe AWC products
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="turbulence-map/1.0"
          for u in "stationinfo?bbox=30,-108,33,-105&format=json" "navaid?ids=EWM&format=json" "navaid?bbox=30,-108,33,-105&format=json" "airport?ids=KELP&format=json" "stationinfo?bbox=15,-180,72,-50&format=json"; do
            echo "=== $u"
            curl -s -A "$UA" -w "\nHTTP %{http_code} size %{size_download}\n" "https://aviationweather.gov/api/data/$u" > out.txt
            tail -1 out.txt; head -c 1500 out.txt; echo
            python3 -c "
          import json
          t=open('out.txt').read().rsplit('\nHTTP',1)[0]
          d=json.loads(t); print('count',len(d))" || true
          done
