name: Probe GTG data (temporary)
on:
  push:
    branches: [claude/project-thread-khvc6s]
    paths: [.github/workflows/probe-gtg.yml, tools/probe_gtg.py]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pygrib numpy
      - run: python tools/probe_gtg.py
