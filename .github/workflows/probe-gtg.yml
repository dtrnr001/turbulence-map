name: Check GTG build (temporary)
on:
  push:
    branches: [claude/project-thread-khvc6s]
    paths: [.github/workflows/probe-gtg.yml, gtg_profile.py]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -q -r requirements.txt
      - run: mkdir -p out && time python gtg_profile.py out && python -c "import json;d=json.load(open('out/gtg.json'));print(d['run'],d['boxValue'],len(d['hours']),[h['valid'] for h in d['hours']])"
