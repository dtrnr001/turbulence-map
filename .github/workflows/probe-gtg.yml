name: Probe GTG data (temporary)
on:
  push:
    branches: [claude/project-thread-khvc6s]
    paths: [.github/workflows/probe-gtg.yml, gtg_profile.py]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pygrib numpy
      - run: mkdir -p out && time python gtg_profile.py out
      - run: mkdir -p outmax && sed -i 's/^AGG = 0.9 /AGG = "max" /' gtg_profile.py && grep -n "^AGG" gtg_profile.py && python gtg_profile.py outmax
      - name: dump sample for screenshots
        run: |
          python - <<'PY'
          import json, gzip, base64
          for name in ["out", "outmax"]:
              d = json.load(open(f"{name}/gtg.json"))
              nl = len(d["levelsFt"]); s = d["hours"][1]["cat"]
              for k in (5, 20, 35):
                  col = s[k::nl]; print(name, d["levelsFt"][k], {c: col.count(c) for c in "01234."})
          b = base64.b64encode(gzip.compress(open("out/gtg.json", "rb").read(), 9)).decode()
          print("B64LEN", len(b))
          for i in range(0, len(b), 4000): print("B64:" + b[i:i+4000])
          PY
