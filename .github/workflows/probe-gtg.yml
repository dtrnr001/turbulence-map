name: Probe GTG data (temporary)
on:
  push:
    branches: [claude/project-thread-khvc6s]
    paths: [.github/workflows/probe-gtg.yml, gtg_profile.py]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pygrib numpy
      - run: mkdir -p out && time python gtg_profile.py out
      - uses: actions/upload-artifact@v4
        with: {name: gtg, path: out/gtg.json}
