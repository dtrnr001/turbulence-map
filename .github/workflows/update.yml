name: Update PIREPs and deploy map

on:
  schedule:
    # GitHub only honours this about once an hour; the "next" job below keeps a
    # 10-minute chain going, and this schedule restarts the chain if it ever stops.
    - cron: "*/10 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # about 2 minutes once an hour when a new turbulence forecast (GTG) comes out, under 1 minute otherwise
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deploy1.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # numpy + pygrib read NOAA's turbulence forecast (GRIB2) for the flight profile view
      - run: pip install -q -r requirements.txt || echo "couldn't install the GRIB reader; the flight profile keeps the last forecast"
      - name: Fetch turbulence PIREPs from NOAA AWC
        run: python fetch_pireps.py site/pirep.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      # GitHub sometimes can't see the just-uploaded artifact yet; wait and retry once.
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - id: deployment
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4

  # Start the next update about 10 minutes after this one started.
  # Skipped if another update is already queued or running, so chains never pile up.
  next:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Wait until 10 minutes after this run started
        run: |
          # retry GitHub API hiccups so one timeout doesn't break the 10-minute chain
          started=""
          for i in 1 2 3 4 5; do started=$(gh api repos/$REPO/actions/runs/${{ github.run_id }} --jq .run_started_at) && break; sleep 15; done
          if [ -n "$started" ]; then wait=$(( 600 - ( $(date +%s) - $(date -d "$started" +%s) ) )); else wait=420; fi
          echo "sleeping ${wait}s"
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
      - name: Queue the next update
        run: |
          others=""
          for i in 1 2 3 4 5; do
            others=$(gh api "repos/$REPO/actions/workflows/update.yml/runs?per_page=20" \
              --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending")] | length') && break
            sleep 15
          done
          others=${others:-0}
          if [ "$others" -gt 0 ]; then echo "another update is already queued or running; not chaining"; exit 0; fi
          for i in 1 2 3 4 5; do gh workflow run update.yml --repo "$REPO" --ref main && exit 0; sleep 20; done
          exit 1

