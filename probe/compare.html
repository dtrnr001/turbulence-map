<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>html,body,#m{margin:0;height:100%;background:#1b2228}.dark-tiles{filter:grayscale(1) invert(1) brightness(.95) contrast(.6)}
#lbl{position:absolute;z-index:999;top:8px;left:8px;background:#000c;color:#fff;font:16px sans-serif;padding:4px 8px;border-radius:6px}</style></head>
<body><div id="m"></div><div id="lbl"></div><script>
const q = new URLSearchParams(location.search), src = q.get("src"), v = (q.get("v")||"39,-97,4").split(",").map(Number);
const map = L.map("m",{zoomControl:false}).setView([v[0],v[1]],v[2]);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{className:"dark-tiles",maxZoom:10}).addTo(map);
if(src==="iem") L.tileLayer("https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913/{z}/{x}/{y}.png",{opacity:.75}).addTo(map);
if(src==="qcd") L.tileLayer.wms("https://opengeo.ncep.noaa.gov/geoserver/conus/conus_bref_qcd/ows",{layers:"conus_bref_qcd",format:"image/png",transparent:true,opacity:.75}).addTo(map);
document.getElementById("lbl").textContent = (src==="iem"?"Current: IEM raw NEXRAD":"NOAA MRMS quality-controlled") + " · " + new Date().toISOString().slice(11,16)+"Z";
</script></body></html>
